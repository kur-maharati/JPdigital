<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Jadwal Digital SMK Maharati</title>

    <link
        rel="stylesheet"
        href="style.css?v=5"
    >

</head>


<body>

<div class="container">


    <header>

        <div class="logo">

            <img
                src="assets/logo.png"
                id="logoSekolah"
                alt="Logo SMK Maharati"
            >

        </div>


        <div class="identitas">

            <h1 id="namaSekolah">
                SMK MAHARATI
            </h1>

            <h3 id="tanggal">
                -
            </h3>

        </div>


        <div class="clock">

            <span id="jamDigital">
                00:00:00
            </span>

        </div>

    </header>


    <section class="info">


        <div class="box">

            <h3>MULAI</h3>

            <h1 id="jamKe">-</h1>

        </div>


        <div class="box">

            <h3>NAMA JAM</h3>

            <h1 id="namaJam">-</h1>

        </div>


        <div class="box">

            <h3>SELESAI</h3>

            <h1 id="jamSelesai">-</h1>

        </div>


        <div class="box">

            <h3>COUNTDOWN</h3>

            <h1 id="countdown">
                00:00:00
            </h1>

        </div>


    </section>


    <section class="jadwal">

        <table>

            <thead>

                <tr>

                    <th style="width:10%">
                        KELAS
                    </th>

                    <th style="width:28%">
                        PELAJARAN SAAT INI
                    </th>

                    <th style="width:18%">
                        GURU
                    </th>

                    <th style="width:28%">
                        PELAJARAN BERIKUTNYA
                    </th>

                    <th style="width:16%">
                        GURU
                    </th>

                </tr>

            </thead>


            <tbody id="dataJadwal">

                <tr>

                    <td colspan="5">
                        Memuat data...
                    </td>

                </tr>

            </tbody>

        </table>

    </section>


    <button id="btnFullscreen">
        SCREEN
    </button>


</div>


<script src="script.js?v=5"></script>

</body>

</html>
